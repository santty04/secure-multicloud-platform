[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "azure-identity>=1.25.3",
    "azure-mgmt-compute>=38.3.0",
    "azure-mgmt-network>=32.0.0",
    "boto3>=1.43.79",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.23.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]
